# Optional: use the pre-commit framework (https://pre-commit.com) instead of .githooks/.
#   pip install pre-commit && pre-commit install
# Run `pre-commit autoupdate` now and then to move to the newest gitleaks release.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
