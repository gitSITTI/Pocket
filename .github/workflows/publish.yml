name: Publish

# Runs when a version tag such as v0.2.0 is pushed. See docs/publishing.md for the one-time setup.
# The npm step waits for approval if the "release" environment has required reviewers.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release tags must be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "The tagged commit is not on main. Merge it first, then tag." >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Registry metadata matches the tag
        run: node scripts/registry-metadata.mjs check --tag "$GITHUB_REF_NAME"

      - name: Validate the example content
        run: POCKET_CONTENT_DIR=examples/content node dist/cli.js validate --strict

      - name: Pack
        run: |
          mkdir pack
          npm pack --pack-destination pack

      - name: Check what is in the package
        run: |
          tar -tzf pack/*.tgz | sort > pack/files.txt
          cat pack/files.txt
          if grep -E '(^|/)(\.env|\.denylist|\.pocket|\.git)(/|$)|(^|/)node_modules/|^package/(src|tests)/' pack/files.txt; then
            echo "The package contains files that should not be published." >&2
            exit 1
          fi
          grep -qx 'package/dist/server.js' pack/files.txt
          grep -qx 'package/dist/cli.js' pack/files.txt

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: pack/*.tgz
          if-no-files-found: error

  npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # lets npm record where the package was built (provenance)
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: package
          path: pack
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish the package that was just built and checked
        run: npm publish pack/*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  registry:
    name: Publish to the MCP Registry
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub login for the registry, no stored secret
    env:
      # To upgrade: set the new version and the sha256 of its mcp-publisher_linux_amd64.tar.gz
      # from https://github.com/modelcontextprotocol/registry/releases
      MCP_PUBLISHER_VERSION: v1.8.1
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait until the package is visible on npm
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          for attempt in $(seq 1 30); do
            if npm view "${name}@${version}" version > /dev/null 2>&1; then
              echo "${name}@${version} is on npm"
              exit 0
            fi
            sleep 10
          done
          echo "${name}@${version} did not appear on npm within five minutes" >&2
          exit 1

      - name: Install mcp-publisher (checksum verified)
        run: |
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl -fsSLo "${archive}" "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${archive}"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" mcp-publisher
          chmod +x mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate
      - name: Log in with GitHub
        run: ./mcp-publisher login github-oidc
      - name: Publish to the registry
        run: ./mcp-publisher publish
