name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Validate the example content
        run: POCKET_CONTENT_DIR=examples/content node dist/cli.js validate --strict

  semantic:
    name: Search by meaning (real model runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The package is optional, so the jobs above run without it. This job installs it (CPU only:
      # skipping the install scripts avoids a large GPU download) and runs the real thing against
      # a tiny test model. It is pinned to the version that was tested; peerDependencies allows newer.
      - name: Install the optional package
        run: ONNXRUNTIME_NODE_INSTALL=skip npm install --no-save --ignore-scripts @huggingface/transformers@4.3.1
      - run: POCKET_REQUIRE_SEMANTIC_TESTS=1 npm test
      - run: npm run build
      - name: Search by meaning through the built command line and server
        run: npm run smoke:semantic

  gitleaks:
    runs-on: ubuntu-latest
    env:
      # To upgrade: set the new version and the sha256 of its linux_x64 archive from
      # https://github.com/gitleaks/gitleaks/releases (the *_checksums.txt file).
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan full git history
        run: ./gitleaks git --redact --verbose --no-banner --config .gitleaks.toml
