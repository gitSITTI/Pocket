name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Validate the example content
        run: POCKET_CONTENT_DIR=examples/content node dist/cli.js validate --strict

  semantic:
    name: Search by meaning (real model runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The package is optional, so the jobs above run without it. This job installs it and runs the
      # real thing against a tiny test model. Notes:
      # - It is pinned to the version that was tested; peerDependencies allows newer ones.
      # - Skipping the install scripts avoids a large GPU download; the CPU build works without them.
      # - npm 11 will not install an optional peer dependency into the project that declares it, so
      #   the declaration is removed from this throwaway checkout first. Users are not affected: they
      #   install the package in their own project.
      - name: Install the optional package
        run: |
          npm pkg delete peerDependencies peerDependenciesMeta
          ONNXRUNTIME_NODE_INSTALL=skip npm install --no-save --ignore-scripts @huggingface/transformers@4.3.1
          test -d node_modules/@huggingface/transformers
      - run: POCKET_REQUIRE_SEMANTIC_TESTS=1 npm test
      - run: npm run build
      - name: Search by meaning through the built command line and server
        run: npm run smoke:semantic

  connector-demo:
    name: Connector demo (captured traffic to a working MCP server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm ci --prefix demos/connector-from-traffic
      - run: pip install mitmproxy2swagger==0.15.0
      # Recovers a spec from the committed capture, generates an MCP server from it, builds it, and
      # makes real tool calls against the demo app. See docs/building-connectors.md.
      - name: Capture to spec to connector to verified tool calls
        run: node demos/connector-from-traffic/pipeline/run.mjs
      - name: The same from a spec the vendor publishes
        run: node demos/connector-from-traffic/pipeline/run.mjs --from-spec official/openapi.yaml --expose getMe,listNotes,getNote

  gitleaks:
    runs-on: ubuntu-latest
    env:
      # To upgrade: set the new version and the sha256 of its linux_x64 archive from
      # https://github.com/gitleaks/gitleaks/releases (the *_checksums.txt file).
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan full git history
        run: ./gitleaks git --redact --verbose --no-banner --config .gitleaks.toml
